bundle:
  name: dpr-application

sync:
  include:
    - backend/static/**
    - backend/wheels/**

variables:
  postgres_branch:
    description: Lakebase branch resource name
  postgres_database:
    description: Lakebase database resource name

resources:
  apps:
    app:
      name: "dpr-application"
      description: "J&J Demand Planning Review PoC"
      source_code_path: ./backend
      lifecycle:
        started: true
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://adb-6311558837731959.19.azuredatabricks.net
    variables:
      postgres_branch: projects/demandplanningreviewtool/branches/production
      postgres_database: projects/demandplanningreviewtool/branches/production/databases/databricks-postgres